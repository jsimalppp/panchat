name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo keeps only lib/, pubspec and tooling. Generate the Android
      # project, then apply Panchat's package id, permissions and HTTPS-only flag.
      - name: Generate and patch Android project
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.panchat --project-name panchat .
          fi
          python3 tool/patch_android.py

      - run: flutter pub get

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "Missing repo secret SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "Missing repo secret SUPABASE_ANON_KEY"; exit 1; }
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: panchat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
